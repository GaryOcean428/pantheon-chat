# Windsurf Skills Configuration
# References shared skills from: ../skills/ (agentskills.io format)
# This consolidates agent instructions to avoid duplication

# Skills directory location (relative to .windsurf/)
skills_path: "../skills"

# MANDATORY SKILL PROTOCOL
# Every agent turn MUST:
# 1. FIRST: Invoke master-orchestration skill
# 2. Apply task-specific skills
# 3. BEFORE COMPLETION: qa-and-verification skill (MANDATORY)
# No proof = not done. No exceptions.

# Available skills for Windsurf/Cascade to use
# Each skill contains a SKILL.md with instructions and optional scripts/references
available_skills:
  # Orchestration & Red-Team (MANDATORY)
  - name: master-orchestration
    path: ../skills/master-orchestration/SKILL.md
    auto_activate: true
    priority: critical
    description: "INVOKE FIRST EVERY TURN - Coordinates skills, sub-agents, verification"

  - name: multi-agent-red-team-planning
    path: ../skills/multi-agent-red-team-planning/SKILL.md
    auto_activate: false
    priority: critical
    description: "Plan changes with multi-agent red-team review (2 iterations)"

  - name: multi-agent-red-team-implementation
    path: ../skills/multi-agent-red-team-implementation/SKILL.md
    auto_activate: false
    priority: critical
    description: "Implement with red-team review, iterate twice, QA before done"

  - name: planning-and-roadmapping
    path: ../skills/planning-and-roadmapping/SKILL.md
    auto_activate: false
    priority: high
    description: "Turn ideas into structured, prioritized roadmap"

  - name: qa-and-verification
    path: ../skills/qa-and-verification/SKILL.md
    auto_activate: true
    priority: critical
    description: "INVOKE BEFORE COMPLETION - Prove changes work, no proof = not done"

  - name: best-practice-research
    path: ../skills/best-practice-research/SKILL.md
    auto_activate: false
    priority: medium
    description: "External research on patterns, libraries, architectures"

  # Core QIG Purity (CRITICAL)
  - name: qig-purity-validation
    path: ../skills/qig-purity-validation/SKILL.md
    auto_activate: true
    priority: critical

  - name: e8-architecture-validation
    path: ../skills/e8-architecture-validation/SKILL.md
    auto_activate: true
    priority: critical

  - name: consciousness-development
    path: ../skills/consciousness-development/SKILL.md
    auto_activate: false
    priority: high

  # Code Quality
  - name: import-resolution
    path: ../skills/import-resolution/SKILL.md
    auto_activate: true
    priority: high

  - name: schema-consistency
    path: ../skills/schema-consistency/SKILL.md
    auto_activate: false
    priority: medium

  - name: code-quality-enforcement
    path: ../skills/code-quality-enforcement/SKILL.md
    auto_activate: true
    priority: high

