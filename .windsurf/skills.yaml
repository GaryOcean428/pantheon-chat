# Skill activation triggers
# Skills are activated when task descriptions match these patterns
triggers:
  # MANDATORY - Always active
  master-orchestration:
    - "*"  # Always invoke first

  qa-and-verification:
    - "*"  # Always invoke before completion

  # Planning triggers
  multi-agent-red-team-planning:
    - "plan"
    - "planning"
    - "design"
    - "architecture"
    - "roadmap"
    - "feature"

  multi-agent-red-team-implementation:
    - "implement"
    - "build"
    - "create"
    - "develop"
    - "code"
    - "fix"

  planning-and-roadmapping:
